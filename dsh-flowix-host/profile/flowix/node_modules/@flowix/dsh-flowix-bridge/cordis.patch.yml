- insert:
    - id: sdk-jsonrpc-server
      # The server belongs to the immutable runtime bundle, not the writable
      # user profile. dsh-host replaces this token with its absolute file URL
      # while installing the profile into DSH_HOME.
      name: __FLOWIX_DSH_SDK_SERVER__
    - id: flowix-dsh-bridge
      name: '@flowix/dsh-flowix-bridge'

# Do not mount the legacy stdio surfaces when direct App Server mode is active.
- id: sdk-jsonrpc-server
  disabled: !!js process.env.FLOWIX_DSH_APPSERVER_STDIO ?? false
- id: flowix-dsh-bridge
  disabled: !!js process.env.FLOWIX_DSH_APPSERVER_STDIO ?? false
