name: Release

# Tag-driven release pipeline. Triggers on:
#   - push of a tag matching v* (e.g. v1.0.3)
#   - manual workflow_dispatch (for ad-hoc dry runs)
#
# Flowix and standalone DSH products are built from the same tag workflow,
# but remain separate artifacts. Flowix installers never embed DSH; the DSH
# matrix publishes signed archives and one merged manifest after all targets.
#
# Required secrets (set in repo Settings → Secrets and variables):
#   TAURI_SIGNING_PRIVATE_KEY         - minisign private key contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - optional, only if your key has one
#   GITHUB_TOKEN                      - provided automatically by Actions
#   CLOUDFLARE_API_TOKEN              - R2 upload token for DSH publishing
#   CLOUDFLARE_ACCOUNT_ID             - Cloudflare account used by R2
#
# Flowix updater and DSH archives intentionally share TAURI_SIGNING_PRIVATE_KEY.
# The DSH public-key text is derived from tauri.conf.production.json.
#
# Optional (only needed for native installer signing, NOT required for
# tauri-plugin-updater's minisign signature):
#   APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_KEYCHAIN_PROFILE
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, WINDOWS_CERT_THUMBPRINT, WINDOWS_TIMESTAMP_URL

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# prevent duplicate runs while a release is in flight
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dsh-gate:
    name: DSH preflight gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked Harness checkout
        run: |
          corepack enable
          npm --prefix dsh-flowix-host run vendor:install

      - name: Run DSH host gate before packaging
        run: |
          npm --prefix dsh-flowix-host run check
          npm --prefix dsh-flowix-host run test:e2e

  release:
    name: build (${{ matrix.platform }})
    needs: dsh-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/target -> release

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Derive shared DSH public key
        shell: bash
        run: |
          {
            echo 'FLOWIX_DSH_UPDATE_PUBLIC_KEY<<FLOWIX_DSH_PUBLIC_KEY_EOF'
            node scripts/derive-dsh-public-key.mjs
            echo 'FLOWIX_DSH_PUBLIC_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Build + sign + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # minisign (tauri-plugin-updater). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS code-signing. Optional. Skip with FLOWIX_ALLOW_UNSIGNED=1.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

          # Windows code-signing.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

        with:
          tagName: v__VERSION__
          releaseName: "Flowix v__VERSION__"
          releaseBody: |
            See the [CHANGELOG] for the full set of changes.

            [CHANGELOG]: ../../CHANGELOG.md
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  dsh-build:
    name: build DSH (${{ matrix.name }})
    needs: dsh-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platform: macos-latest
            targets: node24-macos-arm64,node24-macos-x64
          - name: linux
            platform: ubuntu-22.04
            targets: node24-linux-x64
          - name: windows
            platform: windows-latest
            targets: node24-windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (minisign CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Install minisign
        shell: bash
        run: cargo install minisign --locked

      - name: Install dependencies
        run: npm ci

      - name: Build DSH sidecars
        shell: bash
        run: |
          corepack enable
          if [[ "${{ matrix.name }}" == "macos" ]]; then
            npm run dsh:build:macos
          else
            npm run dsh:build -- --targets=${{ matrix.targets }}
          fi

      - name: Check DSH host
        run: npm --prefix dsh-flowix-host run check

      - name: Run DSH sidecar E2E
        run: npm --prefix dsh-flowix-host run test:sidecar:e2e

      - name: Package signed DSH archive
        shell: bash
        env:
          FLOWIX_DSH_REQUIRE_SIGNATURE: "1"
          FLOWIX_DSH_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run dsh:package -- --targets=${{ matrix.targets }}

      - name: Upload DSH artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.name }}
          path: |
            .build/releases/dsh/Flowix-DSH_*
            .build/releases/dsh/dsh-latest.json
          if-no-files-found: error

  dsh-publish:
    name: publish DSH manifest
    needs: dsh-build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download DSH artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-*
          path: .build/dsh-artifacts

      - name: Merge platform manifests
        id: manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find .build/dsh-artifacts -name dsh-latest.json -type f -print)
          test "${#manifests[@]}" -gt 0
          node scripts/merge-dsh-manifests.mjs .build/dsh-latest.json "${manifests[@]}" \
            --require-platforms=darwin-aarch64,darwin-x86_64,linux-x86_64,windows-x86_64
          version="$(node -p "JSON.parse(require('fs').readFileSync('.build/dsh-latest.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Publish DSH archives and manifests to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DSH_R2_BUCKET: ${{ vars.FLOWIX_DSH_R2_BUCKET || 'flowix-downloads' }}
          DSH_VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="dsh/v${DSH_VERSION}"
          while IFS= read -r archive; do
            name="$(basename "$archive")"
            wrangler r2 object put "$DSH_R2_BUCKET/$prefix/$name" --file "$archive" --remote
            if [[ -f "${archive}.minisig" ]]; then
              wrangler r2 object put "$DSH_R2_BUCKET/$prefix/$name.minisig" --file "${archive}.minisig" --remote
            fi
          done < <(find .build/dsh-artifacts -name 'Flowix-DSH_*' -type f -print)
          wrangler r2 object put "$DSH_R2_BUCKET/$prefix/dsh-latest.json" \
            --file .build/dsh-latest.json --remote
          wrangler r2 object put "$DSH_R2_BUCKET/dsh/latest.json" \
            --file .build/dsh-latest.json --remote
