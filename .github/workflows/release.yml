name: Release

# Tag-driven release pipeline. Triggers on:
#   - push of a tag matching v* (e.g. v1.0.3)
#   - manual workflow_dispatch (for ad-hoc dry runs)
#
# Flowix and standalone DSH products are built from the same tag workflow,
# but remain separate artifacts. Flowix installers never embed DSH; the DSH
# matrix publishes signed archives and one merged manifest after all targets.
# Flowix artifacts stay in a GitHub draft here. This workflow does not update
# https://flowix-memo.com/latest.json; the explicit local `npm run
# release:updater` flow remains the only production updater publication path.
#
# Required secrets (set in repo Settings → Secrets and variables):
#   TAURI_SIGNING_PRIVATE_KEY         - minisign private key contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - optional, only if your key has one
#   GITHUB_TOKEN                      - provided automatically by Actions
#   CLOUDFLARE_API_TOKEN              - R2 upload token for DSH publishing
#   CLOUDFLARE_ACCOUNT_ID             - Cloudflare account used by R2
#
# Flowix updater and DSH archives intentionally share TAURI_SIGNING_PRIVATE_KEY.
# The DSH public-key text is derived from tauri.conf.production.json.
#
# Required for notarized macOS release artifacts (separate from the
# tauri-plugin-updater minisign signature):
#   APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_PRIVATE_KEY
# Required for signed Windows release artifacts:
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, WINDOWS_CERT_THUMBPRINT, WINDOWS_TIMESTAMP_URL

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# prevent duplicate runs while a release is in flight
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dsh-gate:
    name: DSH preflight gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked Harness checkout
        run: |
          corepack enable
          npm --prefix dsh-flowix-host run vendor:install

      - name: Run DSH host gate before packaging
        run: |
          npm --prefix dsh-flowix-host run check
          npm --prefix dsh-flowix-host run test:e2e

  release:
    name: build (${{ matrix.platform }})
    needs: dsh-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/target -> release

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Derive shared DSH public key
        shell: bash
        run: |
          {
            echo 'FLOWIX_DSH_UPDATE_PUBLIC_KEY<<FLOWIX_DSH_PUBLIC_KEY_EOF'
            node scripts/derive-dsh-public-key.mjs
            echo 'FLOWIX_DSH_PUBLIC_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/flowix-developer-id.p12"
          keychain="$RUNNER_TEMP/flowix-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate"

      - name: Prepare Apple notarization API key
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and sign Flowix CLI sidecar
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bash scripts/build-cli.sh --target=${{ matrix.target }}

      - name: Import Windows signing certificate for Tauri
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'flowix-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $actual = $certificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            $expected = $env:WINDOWS_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            if ($actual -ne $expected) {
              throw "Imported certificate thumbprint mismatch: expected $expected, got $actual"
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare production Tauri config
        id: production-config
        shell: bash
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          case "${{ matrix.target }}" in
            *apple-darwin) platform=darwin ;;
            *windows-msvc) platform=win32 ;;
            *) platform=linux ;;
          esac
          config="$(node scripts/prepare-tauri-production-config.mjs --platform "$platform")"
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Build + sign + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # minisign (tauri-plugin-updater). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS Developer ID signing; notarization credentials are exported
          # through GITHUB_ENV by the API-key preparation step.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Windows code-signing.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

        with:
          tagName: v__VERSION__
          releaseName: "Flowix v__VERSION__"
          releaseBody: |
            See the [CHANGELOG] for the full set of changes.

            [CHANGELOG]: ../../CHANGELOG.md
          releaseDraft: true
          prerelease: false
          args: --config ${{ steps.production-config.outputs.path }} --target ${{ matrix.target }}

      - name: Verify notarized macOS DMG
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=""
          for root in app/target .build/cargo-target; do
            [[ -d "$root" ]] || continue
            dmg="$(find "$root" -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
            [[ -z "$dmg" ]] || break
          done
          test -n "$dmg"
          bash scripts/verify-macos-release.sh --notarized "$dmg" "${{ matrix.target }}"

  dsh-build:
    name: build DSH (${{ matrix.name }})
    needs: dsh-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-15
            target: node24-macos-arm64
          - name: macos-x64
            platform: macos-15-intel
            target: node24-macos-x64
          - name: linux
            platform: ubuntu-22.04
            target: node24-linux-x64
          - name: windows
            platform: windows-latest
            target: node24-windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (minisign CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Install minisign
        shell: bash
        run: cargo install minisign --locked

      - name: Install dependencies
        run: npm ci

      - name: Build DSH sidecars
        shell: bash
        run: |
          corepack enable
          npm --prefix dsh-flowix-host run build:bundle -- --target=${{ matrix.target }}

      - name: Check DSH host
        run: npm --prefix dsh-flowix-host run check

      - name: Run DSH sidecar E2E
        run: npm --prefix dsh-flowix-host run test:sidecar:e2e

      - name: Package signed DSH archive
        shell: bash
        env:
          FLOWIX_DSH_REQUIRE_SIGNATURE: "1"
          FLOWIX_DSH_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run dsh:package -- --targets=${{ matrix.target }}

      - name: Upload DSH artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.name }}
          path: |
            .build/releases/dsh/Flowix-DSH_*
            .build/releases/dsh/dsh-latest.json
          if-no-files-found: error

  dsh-publish:
    name: publish DSH manifest
    needs: dsh-build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download DSH artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-*
          path: .build/dsh-artifacts

      - name: Merge platform manifests
        id: manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find .build/dsh-artifacts -name dsh-latest.json -type f -print)
          test "${#manifests[@]}" -gt 0
          node scripts/merge-dsh-manifests.mjs .build/dsh-latest.json "${manifests[@]}" \
            --require-platforms=darwin-aarch64,darwin-x86_64,linux-x86_64,windows-x86_64
          version="$(node -p "JSON.parse(require('fs').readFileSync('.build/dsh-latest.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Publish DSH archives and manifests to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DSH_R2_BUCKET: ${{ vars.FLOWIX_DSH_R2_BUCKET || 'flowix-downloads' }}
          DSH_VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="dsh/v${DSH_VERSION}"
          while IFS= read -r archive; do
            name="$(basename "$archive")"
            wrangler r2 object put "$DSH_R2_BUCKET/$prefix/$name" --file "$archive" --remote
            if [[ -f "${archive}.minisig" ]]; then
              wrangler r2 object put "$DSH_R2_BUCKET/$prefix/$name.minisig" --file "${archive}.minisig" --remote
            fi
          done < <(find .build/dsh-artifacts -name 'Flowix-DSH_*' -type f -print)
          wrangler r2 object put "$DSH_R2_BUCKET/$prefix/dsh-latest.json" \
            --file .build/dsh-latest.json --remote
          wrangler r2 object put "$DSH_R2_BUCKET/dsh/latest.json" \
            --file .build/dsh-latest.json --remote
