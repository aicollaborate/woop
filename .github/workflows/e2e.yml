name: DSH E2E

# DSH E2E requires a built host and vendored Harness dependencies. Keep it
# explicit so a provider/runtime environment issue cannot block ordinary tests.
on:
  workflow_dispatch:

jobs:
  deepseek-harness:
    name: DeepSeek Harness integration
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DSH development host
        run: |
          corepack enable
          npm run dsh:build:dev

      - name: Run DSH host E2E
        run: npm --prefix dsh-flowix-host run test:e2e
