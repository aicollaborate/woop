# Flowix dev profile: keep the upstream agent runtime, but let dsh-appserver
# own the stdio JSON-RPC surface.
- id: typert
  disabled: true
- id: typert-loader
  disabled: true
- id: typert-gateway
  disabled: true
- id: session-title-llm
  disabled: true
- id: settings
  config:
    path: !!js process.env.DSH_SETTINGS_PATH ?? undefined
- id: credentials
  config:
    path: !!js process.env.DSH_CREDENTIALS_PATH ?? undefined
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: dsh-appserver-extension
  config:
    stdio: !!js process.env.FLOWIX_DSH_APPSERVER_STDIO ?? false
