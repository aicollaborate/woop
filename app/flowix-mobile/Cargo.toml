[package]
name = "flowix-mobile"
version.workspace = true
description = "Flowix mobile client"
authors = ["Flowix"]
edition.workspace = true
default-run = "flowix-mobile"

# Keep iOS development on the Vite server while making production builds
# embed the frontend into the Tauri binary. `tauri ios dev` intentionally does
# not enable this feature; the release/TestFlight commands do.
[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "flowix_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flowix-core = { workspace = true }
flowix-sync = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
