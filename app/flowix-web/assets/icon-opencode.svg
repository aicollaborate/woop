<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1f2937" fill-rule="evenodd">
  <title>opencode</title>
  <!--
    hardcoded 深灰填充 (#1f2937) ── 浅色主题下在浅底上清晰可见。
    深色主题下 dark.css 的 [data-theme="dark"] img[data-agent-icon="opencode"]
    通过 CSS filter (brightness(0) invert(1)) 反相成白色。
    单一来源 (dark.css) 控制深色适配, 不在 SVG 内嵌 prefers-color-scheme
    是为了避免与外层应用主题 ([data-theme]) 出现双重处理冲突的情况。
  -->
  <path d="M16 6H8v12h8V6zm4 16H4V2h16v20z" />
</svg>
