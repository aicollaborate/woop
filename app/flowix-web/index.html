<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flowix</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        pointer-events: none;
      }
      #app-loading::before {
        width: 24px;
        height: 24px;
        box-sizing: border-box;
        border: 2px solid rgba(120, 113, 108, 0.28);
        border-top-color: #78716c;
        border-radius: 50%;
        content: "";
        animation: app-loading-spin 0.72s linear infinite;
      }
      html[data-theme="dark"] #app-loading {
        background: #171717;
      }
      html[data-theme="dark"] #app-loading::before {
        border-color: rgba(214, 211, 209, 0.24);
        border-top-color: #d6d3d1;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading::before { animation-duration: 1.4s; }
      }
    </style>
    <!--
      首屏 boot: 在 CSS paint 之前把 data-theme 写到 <html>。
      走外部文件 (而不是 inline <script>) 是因为 Tauri CSP 的
      script-src 'self' 'unsafe-eval' 不含 'unsafe-inline'。 同源
      脚本不受此限制。 详见 public/theme-boot.js。
    -->
    <script src="/theme-boot.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-loading" aria-hidden="true"></div>
    <!-- Vite resolves this bootstrap module to the desktop entry at build
         time, keeping the bundle rooted at a single application entry. -->
    <script type="module" src="/entrypoints/main.ts"></script>
  </body>
</html>
