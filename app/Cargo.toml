[workspace]
resolver = "2"
members = [
    "flowix-desktop",
    "flowix-mobile",
    "flowix-core",
    "flowix-sync",
    "flowix-cli",
]

# 锁定共用依赖到同一版本 ── 避免 backend / cli 走不一致版本。
[workspace.package]
version = "1.1.14"
edition = "2021"

# 锁定共用依赖到同一版本 ── 避免 backend / cli 走不一致版本。
[workspace.dependencies]
flowix-core = { path = "flowix-core" }
flowix-sync = { path = "flowix-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tauri-plugin-process = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.4"
regex = "1.10"
once_cell = "1.19"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
nanoid = "0.4"
dunce = "1.0"
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
clap = { version = "4.5", features = ["std"] }
clap_complete = "4.5"
shell-words = "1.1"
# Windows console codepage 切 UTF-8 用 ── 仅 flowix-cli 直接依赖。
# Win32_Foundation 必须开: SetConsoleCP/SetConsoleOutputCP 返回 BOOL, 被该 feature 门控。
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
