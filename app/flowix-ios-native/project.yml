name: FlowixIOS

options:
  bundleIdPrefix: com.flowix.app
  deploymentTarget:
    iOS: 26.0
  createIntermediateGroups: true

configs:
  debug: debug
  release: release

targets:
  FlowixIOS:
    type: application
    platform: iOS
    sources:
      - path: FlowixIOS
      - path: Resources/EditorWebView
        buildPhase: resources
        type: folder
      - path: ../flowix-web/assets/notebook-icons
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_NAME: Flowix
        PRODUCT_BUNDLE_IDENTIFIER: com.flowix.app.mobile
        CODE_SIGN_ENTITLEMENTS: FlowixIOS/Flowix.entitlements
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.2.1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FlowixIOS/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../.build/native-api/sim"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../.build/native-api/device"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "-lflowix_native_api"
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - "$(inherited)"
          - "-lflowix_native_api"
    dependencies:
      - sdk: WebKit.framework
